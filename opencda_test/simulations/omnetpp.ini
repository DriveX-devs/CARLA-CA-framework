[General]
network = OpenCda5gSmoke
sim-time-limit = 10s
warmup-period = 0s
seed-set = 11
*.numUe = 4

# Core Simu5G/INET setup. These names follow Simu5G 1.7.
**.amcType = "NRAmc"
**.targetBler = 0.01
**.blerShift = 5
*.configurator.config = xmldoc("demo.xml")
*.routingRecorder.enabled = false

# Map CARLA coordinates into a positive 1000 m x 1000 m INET canvas.
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMaxZ = 50m
**.mobility.initFromDisplayString = false

# One standalone NR cell. servingNodeId 0 disables the LTE anchor;
# nrServingNodeId 1 associates the UE with the gNB.
*.gnb.mobility.initialX = 458m
*.gnb.mobility.initialY = 475m
*.gnb.mobility.initialZ = 0m
*.ue[*].masterId = 0

*.ue[*].nrMasterId = 1
*.ue[*].mobility.typename = "ExternalMobility"
*.ue[*].mobility.updateInterval = 0s

*.ue[*].mobility.initialX = 500m
*.ue[*].mobility.initialY = 500m
*.ue[*].mobility.initialZ = 0m
# Lockstep mobility bridge.
*.coordinator.endpoint = "tcp://127.0.0.1:5555"
*.coordinator.step = 0.05s
*.coordinator.duration = 10s
*.coordinator.seed = 11
*.coordinator.timeoutMs = 120000
#*.coordinator.mobilityModule = "^.ue[0].mobility"
*.coordinator.mobilityLog = "results/omnet_mobility.csv"
#*.coordinator.appModule = "^.ue[0].app[0]"
*.coordinator.messageLog = "results/omnet_messages.csv"
*.coordinator.xOffset = 500m
*.coordinator.yOffset = 500m
*.coordinator.zOffset = 0m
*.coordinator.invertY = true
*.coordinator.numActors = 4
*.coordinator.v2vPort = 4000
*.coordinator.edgeActorName = "BS"
*.coordinator.edgeAppModule = "^.server.app[0]"
*.coordinator.edgeHostModule = "^.server"

# Real Simu5G user-plane traffic: UE -> NR gNB -> UPF -> server, then echo.
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "ExternalUdpApp"
*.ue[*].app[0].localPort = 4000
*.ue[*].app[0].coordinatorModule = "^.^.coordinator"

*.ue[0].app[0].actorName = "Cav1"
*.ue[1].app[0].actorName = "Cav2"
*.ue[2].app[0].actorName = "Cav3"
*.ue[3].app[0].actorName = "Cav4"

# CARLA-CA calls its edge/MEC application endpoint "BS".  It is a static
# network endpoint on the server and deliberately has no CARLA mobility actor.
*.server.numApps = 1
*.server.app[0].typename = "ExternalUdpApp"
*.server.app[0].localPort = 4000
*.server.app[0].actorName = "BS"
*.server.app[0].coordinatorModule = "^.^.coordinator"

# Keep scalar results for packet/throughput checks; mobility CSVs are separate.
**.scalar-recording = true
**.vector-recording = false
